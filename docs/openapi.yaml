openapi: 3.0.3
info:
  title: Умный кредитный кабинет ММБ — API
  description: >
    Контракт API цифрового кредитного конвейера малого и микробизнеса (Альфа-Банк).
    Используется для кодогенерации DTO и интерфейсов в бэкенде (Java/Spring Boot)
    и фронтенде (TypeScript).
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

tags:
  - name: auth
    description: Демо-аутентификация и получение JWT
  - name: client-applications
    description: Операции клиента по кредитным заявкам (роль CLIENT)
  - name: employee-applications
    description: Операции сотрудника банка / андеррайтера (роль EMPLOYEE)

paths:
  /api/v1/auth/demo-login:
    post:
      tags:
        - auth
      summary: Демо-вход под выбранной тестовой ролью
      description: >
        Позволяет переключиться между ролями (хороший клиент, плохой клиент, сотрудник банка)
        и получить подписанный JWT токен для последующих запросов.
      operationId: demoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
      responses:
        '200':
          description: Успешная авторизация, токен сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginResponse'
        '400':
          description: Некорректный код пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/client/applications:
    post:
      tags:
        - client-applications
      summary: Создание и отправка новой заявки на кредит
      description: >
        Клиент отправляет параметры заявки. Бэкенд сохраняет заявку в статусе PROCESSING,
        асинхронно инициирует скоринг и мгновенно возвращает ID созданной заявки.
      operationId: createApplication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Заявка успешно принята в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Ошибка валидации параметров заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован (отсутствует или невалиден JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль CLIENT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - client-applications
      summary: Получение списка всех заявок текущего клиента
      description: Возвращает историю и текущие статусы заявок авторизованного клиента.
      operationId: getClientApplications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список заявок клиента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/client/applications/{id}:
    get:
      tags:
        - client-applications
      summary: Получение текущего статуса конкретной заявки клиента (для polling)
      description: Используется фронтендом клиента для циклического опроса статуса обработки заявки.
      operationId: getApplicationById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор кредитной заявки
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: Актуальная информация и статус заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Попытка доступа к чужой заявке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка с указанным ID не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/client/applications/{id}/sign:
    post:
      tags:
        - client-applications
      summary: Подписание кредитного договора заемщиком
      description: Клиент акцептует условия кредита и график платежей простой электронной подписью (ПЭП).
      operationId: signApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор кредитной заявки
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignApplicationRequest'
      responses:
        '200':
          description: Заявка успешно подписана клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Заявка не находится в статусе APPROVED или неверный код подписи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (чужая заявка)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employee/applications:
    get:
      tags:
        - employee-applications
      summary: Реестр заявок для сотрудника банка с пагинацией
      description: Возвращает пагинированный список кредитных заявок с возможностью фильтрации по статусу.
      operationId: getEmployeeApplications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы (начиная с 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Количество элементов на странице
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          required: false
          description: Фильтр по статусу заявки
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Пагинированный список заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPageResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль EMPLOYEE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employee/applications/{id}:
    get:
      tags:
        - employee-applications
      summary: Получение детального досье заявки сотрудником банка
      description: Возвращает полное кредитное досье (РКО, ФНС, БКИ, риск-метрики, график).
      operationId: getEmployeeApplicationDetails
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор кредитной заявки
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Детальное досье кредитной заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetailsResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль EMPLOYEE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employee/applications/{id}/retry:
    post:
      tags:
        - employee-applications
      summary: Повторный запуск кредитного конвейера при техническом сбое
      description: Переводит заявку из MANUAL_REVIEW обратно в PROCESSING и повторно опрашивает внешние шлюзы.
      operationId: retryApplication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор кредитной заявки
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Конвейер успешно перезапущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Заявка не может быть перезапущена (не в статусе MANUAL_REVIEW / TECH_FAILURE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль EMPLOYEE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Передайте JWT токен в формате "Bearer <token>"

  schemas:
    UserCode:
      type: string
      description: Предопределенный код тестового пользователя для демо-входа
      enum:
        - client_good
        - client_bad
        - bank_employee
      example: client_good

    UserRole:
      type: string
      description: Роль пользователя в системе для RBAC
      enum:
        - CLIENT
        - EMPLOYEE
      example: CLIENT

    DemoLoginRequest:
      type: object
      required:
        - userCode
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'

    UserProfile:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: integer
          format: int64
          example: 101
        username:
          type: string
          example: client_good
        role:
          $ref: '#/components/schemas/UserRole'
        companyName:
          type: string
          example: ООО "Ромашка"
        inn:
          type: string
          example: "7701234567"

    DemoLoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Подписанный JWT токен для заголовка Authorization
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDEiLCJyb2xlIjoiUk9MRV9DTElFTlQifQ...
        user:
          $ref: '#/components/schemas/UserProfile'

    LoanPurpose:
      type: string
      description: Цель привлечения кредитного финансирования
      enum:
        - WORKING_CAPITAL       # Пополнение оборотных средств
        - EQUIPMENT             # Приобретение оборудования и транспорта
        - BUSINESS_EXPANSION    # Масштабирование бизнеса / аренда / маркетинг
        - REFINANCING           # Рефинансирование задолженности
      example: WORKING_CAPITAL

    ApplicationStatus:
      type: string
      description: Статус заявки в кредитном конвейере
      enum:
        - PROCESSING            # В обработке (скоринг в фоновом режиме)
        - MANUAL_REVIEW         # Требуется ручной разбор андеррайтером
        - APPROVED              # Одобрено
        - SIGNED                # Договор подписан клиентом (ПЭП)
        - REJECTED              # Отклонено (с указанием причины)
      example: PROCESSING

    CreateApplicationRequest:
      type: object
      required:
        - amount
        - termMonths
        - purpose
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100000
          maximum: 50000000
          description: Запрашиваемая сумма кредита в рублях
          example: 1500000
        termMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: Срок кредита в месяцах
          example: 12
        purpose:
          $ref: '#/components/schemas/LoanPurpose'

    ApplicationResponse:
      type: object
      required:
        - id
        - amount
        - termMonths
        - purpose
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор заявки
          example: 42
        companyName:
          type: string
          description: Наименование компании-заемщика
          example: ООО "Ромашка"
        inn:
          type: string
          description: ИНН компании-заемщика
          example: "7701234567"
        amount:
          type: integer
          format: int64
          description: Запрашиваемая сумма в рублях
          example: 1500000
        termMonths:
          type: integer
          format: int32
          description: Срок кредита в месяцах
          example: 12
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        rejectionReason:
          type: string
          nullable: true
          description: Причина отказа (заполняется при status == REJECTED)
          example: "Превышен показатель предельной долговой нагрузки (ПДН > 80%)"
        approvedAmount:
          type: integer
          format: int64
          nullable: true
          description: Одобренная сумма кредита в рублях
          example: 1200000
        approvedRate:
          type: number
          format: double
          nullable: true
          description: Одобренная процентная ставка в % годовых
          example: 18.5
        schedule:
          $ref: '#/components/schemas/PaymentSchedule'
        createdAt:
          type: string
          format: date-time
          description: Дата и время подачи заявки
          example: "2026-10-22T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Дата и время последнего изменения статуса
          example: "2026-10-22T14:30:05Z"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Описание ошибки для разработчика/пользователя
          example: Некорректные параметры кредитной заявки
        timestamp:
          type: string
          format: date-time
          example: "2026-10-22T14:30:00Z"

    PaymentScheduleItem:
      type: object
      required:
        - monthNumber
        - paymentDate
        - totalPayment
        - principalPayment
        - interestPayment
        - remainingDebt
      properties:
        monthNumber:
          type: integer
          description: Порядковый номер месяца платежа (1, 2, ...)
          example: 1
        paymentDate:
          type: string
          format: date
          description: Дата планового списания аннуитетного платежа
          example: "2026-11-25"
        totalPayment:
          type: integer
          format: int64
          description: Совокупный размер ежемесячного аннуитетного платежа в рублях
          example: 139535
        principalPayment:
          type: integer
          format: int64
          description: Часть платежа, направляемая на погашение основного долга (тело)
          example: 113285
        interestPayment:
          type: integer
          format: int64
          description: Часть платежа, направляемая на оплату процентов банка
          example: 26250
        remainingDebt:
          type: integer
          format: int64
          description: Остаток ссудной задолженности после совершения платежа
          example: 1386715

    PaymentSchedule:
      type: object
      required:
        - monthlyPayment
        - totalInterest
        - totalPayout
        - items
      properties:
        monthlyPayment:
          type: integer
          format: int64
          description: Фиксированный размер регулярного ежемесячного платежа
          example: 139535
        totalInterest:
          type: integer
          format: int64
          description: Совокупная переплата по процентам за весь срок кредитования
          example: 174420
        totalPayout:
          type: integer
          format: int64
          description: Полная стоимость кредита (тело долга + все проценты)
          example: 1674420
        items:
          type: array
          description: Помесячный график аннуитетных платежей
          items:
            $ref: '#/components/schemas/PaymentScheduleItem'

    ReviewReasonCode:
      type: string
      description: Код причины направления кредитной заявки на ручной андеррайтинг
      enum:
        - TECH_FAILURE      # Временная недоступность внешних сервисов (ФНС / БКИ)
        - BORDERLINE_SCORE  # Пограничный кредитный скоринг (50-64 балла)
      example: TECH_FAILURE

    SignApplicationRequest:
      type: object
      required:
        - confirmTerms
        - smsCode
      properties:
        confirmTerms:
          type: boolean
          description: Подтверждение согласия заемщика с условиями кредитования и графиком
          example: true
        smsCode:
          type: string
          description: Код подтверждения простой электронной подписи (ПЭП)
          example: "1234"

    FnsSnapshotDto:
      type: object
      properties:
        inn:
          type: string
          example: "7701234567"
        companyName:
          type: string
          example: ООО "Ромашка"
        stateStatus:
          type: string
          example: ACTIVE
        taxBlocksExist:
          type: boolean
          example: false
        businessAgeMonths:
          type: integer
          example: 36
        createdAt:
          type: string
          format: date-time

    BkiSnapshotDto:
      type: object
      properties:
        inn:
          type: string
          example: "7701234567"
        bkiScore:
          type: integer
          example: 750
        monthlyPaymentRub:
          type: integer
          format: int64
          example: 50000
        currentOverdueDays:
          type: integer
          example: 0
        cntOverdueOver90d:
          type: integer
          example: 0
        riskBucket:
          type: string
          description: Корзина риска (DPD-бакет)
          example: "CURRENT (0 DPD)"
        createdAt:
          type: string
          format: date-time

    ScoringMetricsDto:
      type: object
      properties:
        scoringScore:
          type: integer
          example: 85
        calculatedPdnPercent:
          type: number
          format: double
          example: 34.2
        maxLimitRub:
          type: integer
          format: int64
          example: 4500000

    ApplicationDetailsResponse:
      type: object
      required:
        - id
        - amount
        - termMonths
        - purpose
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 42
        companyName:
          type: string
          example: ООО "Ромашка"
        inn:
          type: string
          example: "7701234567"
        amount:
          type: integer
          format: int64
          example: 1500000
        termMonths:
          type: integer
          format: int32
          example: 12
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        rejectionReason:
          type: string
          nullable: true
          example: null
        approvedAmount:
          type: integer
          format: int64
          nullable: true
          example: 1500000
        approvedRate:
          type: number
          format: double
          nullable: true
          example: 18.5
        reviewReasonCode:
          $ref: '#/components/schemas/ReviewReasonCode'
        canRetry:
          type: boolean
          description: Флаг доступности повторного запуска скорингового конвейера при тех. сбое
          example: true
        user:
          $ref: '#/components/schemas/UserProfile'
        fns:
          $ref: '#/components/schemas/FnsSnapshotDto'
        bki:
          $ref: '#/components/schemas/BkiSnapshotDto'
        scoring:
          $ref: '#/components/schemas/ScoringMetricsDto'
        schedule:
          $ref: '#/components/schemas/PaymentSchedule'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationPageResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 5
