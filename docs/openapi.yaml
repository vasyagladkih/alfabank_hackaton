openapi: 3.0.3
info:
  title: Умный кредитный кабинет ММБ — API
  description: 'Контракт API цифрового кредитного конвейера малого и микробизнеса (Альфа-Банк). Используется
    для кодогенерации DTO и интерфейсов в бэкенде (Java/Spring Boot) и фронтенде (TypeScript).

    '
  version: 1.3.0
servers:
- url: http://localhost:8080
  description: Локальный сервер разработки
tags:
- name: auth
  description: Демо-аутентификация и получение JWT
- name: client-applications
  description: Операции клиента по кредитным заявкам (роль CLIENT)
- name: employee-applications
  description: Операции сотрудника банка / андеррайтера (роль EMPLOYEE)
paths:
  /api/v1/auth/demo-login:
    post:
      tags:
      - auth
      summary: Демо-вход под выбранной тестовой ролью
      description: 'Позволяет переключиться между ролями (хороший клиент, плохой клиент, сотрудник банка)
        и получить подписанный JWT токен для последующих запросов.

        '
      operationId: demoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
      responses:
        '200':
          description: Успешная авторизация, токен сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginResponse'
        '400':
          description: Некорректный код пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/client/applications:
    post:
      tags:
      - client-applications
      summary: Создание и отправка новой заявки на кредит
      description: 'Клиент отправляет параметры заявки. Бэкенд сохраняет заявку в статусе PROCESSING,
        асинхронно инициирует скоринг и мгновенно возвращает ID созданной заявки.

        '
      operationId: createApplication
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Заявка успешно принята в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Ошибка валидации параметров заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован (отсутствует или невалиден JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль CLIENT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - client-applications
      summary: Получение списка всех заявок текущего клиента
      description: Возвращает историю и текущие статусы заявок авторизованного клиента.
      operationId: getClientApplications
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список заявок клиента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/client/applications/{id}:
    get:
      tags:
      - client-applications
      summary: Получение текущего статуса конкретной заявки клиента (для polling)
      description: Используется фронтендом клиента для циклического опроса статуса обработки заявки.
      operationId: getApplicationById
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор кредитной заявки
        schema:
          type: integer
          format: int64
          example: 42
      responses:
        '200':
          description: Актуальная информация и статус заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Попытка доступа к чужой заявке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка с указанным ID не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications:
    get:
      tags:
      - employee-applications
      summary: Реестр заявок для сотрудника банка
      description: Возвращает все заявки при отсутствии status; указанный status фильтрует реестр. Поиск
        — буквальная подстрока ID, компании или ИНН.
      operationId: getEmployeeApplications
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        description: Фильтр по статусу заявки
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: search
        in: query
        required: false
        description: Подстрока ID, названия компании или ИНН; до 120 символов.
        schema:
          type: string
          maxLength: 120
      responses:
        '200':
          description: Список заявок для мониторинга андеррайтером
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль EMPLOYEE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications/{id}:
    get:
      tags:
      - employee-applications
      operationId: getEmployeeDossier
      security:
      - BearerAuth: []
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Актуальная заявка / досье. Точный повтор команды возвращает сохранённый ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDossier'
        '400':
          description: Некорректные параметры учебной команды.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Требуется авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или чужая заявка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Состояние или версия изменились; повторный ключ с другим содержимым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/employee/applications/{id}/decisions:
    post:
      tags:
      - employee-applications
      operationId: decideApplication
      security:
      - BearerAuth: []
      parameters:
      - *id001
      responses:
        '200':
          description: Актуальная заявка / досье. Точный повтор команды возвращает сохранённый ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDossier'
        '400':
          description: Некорректные параметры учебной команды.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Требуется авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или чужая заявка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Состояние или версия изменились; повторный ключ с другим содержимым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDecisionRequest'
  /api/v1/client/applications/{id}/offer-response:
    post:
      tags:
      - client-applications
      operationId: respondToOffer
      security:
      - BearerAuth: []
      parameters:
      - *id001
      responses:
        '200':
          description: Актуальная заявка / досье. Точный повтор команды возвращает сохранённый ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Некорректные параметры учебной команды.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Требуется авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или чужая заявка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Заявка отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Состояние или версия изменились; повторный ключ с другим содержимым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferResponseRequest'
  /api/health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Готовность demo API и PostgreSQL
      security: []
      responses:
        '200':
          description: База доступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: База временно недоступна; технические детали не раскрываются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Передайте JWT токен в формате "Bearer <token>"
  schemas:
    UserCode:
      type: string
      description: Предопределенный код тестового пользователя для демо-входа
      enum:
      - client_good
      - client_bad
      - bank_employee
      example: client_good
    UserRole:
      type: string
      description: Роль пользователя в системе для RBAC
      enum:
      - CLIENT
      - EMPLOYEE
      example: CLIENT
    DemoLoginRequest:
      type: object
      required:
      - userCode
      properties:
        userCode:
          $ref: '#/components/schemas/UserCode'
      additionalProperties: false
    UserProfile:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: integer
          format: int64
          example: 101
        username:
          type: string
          example: client_good
        role:
          $ref: '#/components/schemas/UserRole'
        companyName:
          type: string
          example: ООО "Ромашка"
        inn:
          type: string
          example: '7701234567'
    DemoLoginResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: Подписанный JWT токен для заголовка Authorization
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDEiLCJyb2xlIjoiUk9MRV9DTElFTlQifQ...
        user:
          $ref: '#/components/schemas/UserProfile'
    LoanPurpose:
      type: string
      description: Цель привлечения кредитного финансирования
      enum:
      - WORKING_CAPITAL
      - EQUIPMENT
      - BUSINESS_EXPANSION
      - REFINANCING
      example: WORKING_CAPITAL
    ApplicationStatus:
      type: string
      description: Статус заявки в кредитном конвейере
      enum:
      - PROCESSING
      - MANUAL_REVIEW
      - OFFER_PROPOSED
      - APPROVED
      - REJECTED
      example: PROCESSING
    CreateApplicationRequest:
      type: object
      required:
      - amount
      - termMonths
      - purpose
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100000
          maximum: 50000000
          description: Запрашиваемая сумма кредита в рублях
          example: 1500000
        termMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: Срок кредита в месяцах
          example: 12
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
      additionalProperties: false
    ApplicationResponse:
      type: object
      required:
      - id
      - amount
      - termMonths
      - purpose
      - status
      - createdAt
      - version
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор заявки
          example: 42
        companyName:
          type: string
          description: Наименование компании-заемщика
          example: ООО "Ромашка"
        inn:
          type: string
          description: ИНН компании-заемщика
          example: '7701234567'
        amount:
          type: integer
          format: int64
          description: Запрашиваемая сумма в рублях
          example: 1500000
        termMonths:
          type: integer
          format: int32
          description: Срок кредита в месяцах
          example: 12
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 0
          description: Монотонная версия заявки; увеличивается при каждом изменении состояния.
        decisionSummary:
          allOf:
          - $ref: '#/components/schemas/DecisionSummary'
          nullable: true
        offer:
          allOf:
          - $ref: '#/components/schemas/OfferTerms'
          nullable: true
        rejectionReason:
          type: string
          nullable: true
          description: Причина отказа (заполняется при status == REJECTED)
          example: Превышен показатель предельной долговой нагрузки (ПДН > 80%)
        createdAt:
          type: string
          format: date-time
          description: Дата и время подачи заявки
          example: '2026-10-22T14:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Дата и время последнего изменения статуса
          example: '2026-10-22T14:30:05Z'
    DecisionSummary:
      type: object
      required:
      - ruleVersion
      - assessedAt
      - explanation
      - demoOnly
      properties:
        ruleVersion:
          type: string
        assessedAt:
          type: string
          format: date-time
        explanation:
          type: string
          description: Объяснение учебного результата, не реальное кредитное решение.
        demoOnly:
          type: boolean
          enum:
          - true
    OfferTerms:
      type: object
      description: Учебные условия. Не оферта, не договор, не выдача средств. Исходная сумма заявки остаётся
        в amount заявки.
      required:
      - amount
      - termMonths
      - annualRate
      - monthlyPayment
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100000
          maximum: 50000000
        termMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        annualRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: Десятичная строка годовой demo-ставки в процентах (например 16.50).
        monthlyPayment:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: Рассчитанный сервером учебный платёж в рублях, точность 2 знака.
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: VALIDATION_ERROR
        message:
          type: string
          description: Описание ошибки для разработчика/пользователя
          example: Некорректные параметры кредитной заявки
        timestamp:
          type: string
          format: date-time
          example: '2026-10-22T14:30:00Z'
    EmployeeDecisionType:
      type: string
      enum:
      - APPROVE
      - REJECT
      - COUNTEROFFER
    EmployeeDecisionRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - requestId
      - type
      - rationale
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        requestId:
          type: string
          format: uuid
          description: Ключ повтора в пределах заявки и пользователя; тот же UUID с другим содержимым
            в этой заявке даёт 409.
        type:
          $ref: '#/components/schemas/EmployeeDecisionType'
        rationale:
          type: string
          minLength: 3
          maxLength: 1000
        offerAmount:
          type: integer
          format: int64
          minimum: 100000
          maximum: 50000000
    OfferResponseRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - requestId
      - decision
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        requestId:
          type: string
          format: uuid
          description: Ключ повтора в пределах заявки и пользователя; тот же UUID с другим содержимым
            в этой заявке даёт 409.
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
    DossierFact:
      type: object
      required:
      - code
      - label
      - source
      properties:
        code: &id002
          type: string
        label: *id002
        value:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        source: *id002
    DossierSource:
      type: object
      required:
      - code
      - label
      - demoOnly
      - freshness
      properties:
        code: *id002
        label: *id002
        version:
          type: string
          nullable: true
        observedOn:
          type: string
          format: date
          nullable: true
        demoOnly:
          type: boolean
          enum:
          - true
        freshness:
          type: string
          enum:
          - FRESH
          - STALE
          - MISSING
          - INVALID
    MonthlyTurnover:
      type: object
      required:
      - month
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        turnover: &id003
          type: string
          nullable: true
          pattern: ^-?[0-9]+(\.[0-9]+)?$
    ScoreContribution:
      type: object
      required:
      - code
      - label
      - value
      - points
      - maximum
      - explanation
      properties:
        code: *id002
        label: *id002
        value: *id002
        points:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
        explanation: *id002
    RuleFinding:
      type: object
      required:
      - code
      - severity
      - message
      properties:
        code: *id002
        severity:
          type: string
          enum:
          - HARD_STOP
          - DATA_QUALITY
          - WARNING
          - DECISION
        message: *id002
    RiskAssessment:
      type: object
      required:
      - ruleVersion
      - asOf
      - outcome
      - maxScore
      - evidenceComplete
      - eligibleForManualApproval
      - components
      - findings
      properties:
        ruleVersion: *id002
        asOf:
          type: string
          format: date
        outcome:
          $ref: '#/components/schemas/ApplicationStatus'
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 850
        maxScore:
          type: integer
          minimum: 0
        evidenceComplete:
          type: boolean
        eligibleForManualApproval:
          type: boolean
        annualRate: *id003
        monthlyIncome: *id003
        existingDebtPayment: *id003
        requestedPayment: *id003
        debtRatio: *id003
        affordableAmount:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 50000000
        components:
          type: array
          items:
            $ref: '#/components/schemas/ScoreContribution'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/RuleFinding'
    AuditEvent:
      type: object
      required:
      - id
      - eventType
      - actorRole
      - toStatus
      - createdAt
      - version
      properties:
        id:
          type: integer
          format: int64
        eventType: *id002
        actorRole:
          type: string
          enum:
          - SYSTEM
          - EMPLOYEE
          - CLIENT
        fromStatus:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        rationale:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    EmployeeDossier:
      type: object
      required:
      - application
      - demoOnly
      - facts
      - cashflows
      - sources
      - allowedActions
      - audit
      properties:
        application:
          $ref: '#/components/schemas/ApplicationResponse'
        demoOnly:
          type: boolean
          enum:
          - true
        snapshotCapturedAt:
          type: string
          format: date-time
          nullable: true
        snapshotAsOf:
          type: string
          format: date
          nullable: true
        snapshotOrigin:
          type: string
          nullable: true
        snapshotSha256:
          type: string
          nullable: true
        facts:
          type: array
          items:
            $ref: '#/components/schemas/DossierFact'
        cashflows:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyTurnover'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DossierSource'
        assessment:
          allOf:
          - $ref: '#/components/schemas/RiskAssessment'
          nullable: true
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDecisionType'
        audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    HealthResponse:
      type: object
      required:
