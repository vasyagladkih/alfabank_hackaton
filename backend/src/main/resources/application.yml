spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: alfahackaton
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alfadb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: 8080

demo:
  as-of: ${DEMO_AS_OF:2026-10-23}
  data-provider: ${DATA_PROVIDER:mock}
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}
  processing:
    enabled: ${DEMO_PROCESSING_ENABLED:true}
    delay-ms: ${DEMO_PROCESSING_DELAY_MS:1000}
    initial-delay-ms: ${DEMO_PROCESSING_INITIAL_DELAY_MS:2000}
    batch-size: ${DEMO_PROCESSING_BATCH_SIZE:8}
    max-attempts: ${DEMO_PROCESSING_MAX_ATTEMPTS:3}
    retry-delay-ms: ${DEMO_PROCESSING_RETRY_DELAY_MS:1000}
  enabled: ${DEMO_MODE:false}
  auth-provider: ${AUTH_PROVIDER:mock}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
