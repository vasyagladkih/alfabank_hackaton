spring:
  application:
    name: alfahackaton
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alfadb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: "REPLACE_WITH_LOCAL_DEMO_KEY_NOT_A_REAL_SECRET"
  expiration-ms: 86400000

server:
  port: 8080

demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}
