plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.10.0'
}

group = 'ru.alfahackaton'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def specCandidate = [
	"$rootDir/../docs/openapi.yaml",
	"$rootDir/docs/openapi.yaml"
].find { file(it).exists() }

openApiGenerate {
	generatorName = "spring"
	inputSpec = specCandidate ?: "$rootDir/../docs/openapi.yaml"
	outputDir = "$projectDir/build/generated"
	apiPackage = "ru.alfahackaton.api"
	modelPackage = "ru.alfahackaton.dto"
	configOptions = [
		interfaceOnly: "true",
		useSpringBoot3: "true",
		useTags: "true",
		skipDefaultInterface: "true",
		openApiNullable: "false",
		apiUtil: "false"
	]
}

sourceSets.main.java.srcDirs += "$projectDir/build/generated/src/main/java"
compileJava.dependsOn tasks.openApiGenerate

tasks.named('test') {
	useJUnitPlatform()
}

