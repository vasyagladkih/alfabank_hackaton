plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.10.0'
	id("org.sonarqube") version "7.5.0.8588"
}

group = 'ru.alfahackaton'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
	implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.1.1")
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly("org.projectlombok:lombok:1.18.48")
	annotationProcessor("org.projectlombok:lombok:1.18.48")
}

def specCandidate = [
	"$rootDir/../docs/openapi.yaml",
	"$rootDir/docs/openapi.yaml"
].find { file(it).exists() }

openApiGenerate {
	generatorName = "spring"
	inputSpec = specCandidate ?: "$rootDir/../docs/openapi.yaml"
	outputDir = "$projectDir/build/generated"
	modelPackage = "ru.alfahackaton.dto"
	globalProperties = [
			apis: "false",
			models: ""
	]
	configOptions = [
			useSpringBoot3: "true",
			openApiNullable: "false"
	]
}

sourceSets.main.java.srcDirs += "$projectDir/build/generated/src/main/java"
compileJava.dependsOn tasks.openApiGenerate

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['--enable-preview']
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs += ['--enable-preview']
}

tasks.named('bootRun') {
	jvmArgs += ['--enable-preview']
}

