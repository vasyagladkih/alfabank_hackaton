name: Java PostgreSQL and real demo stack

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alfa_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d alfa_tests"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Deterministic seed drift
        run: python3 scripts/generate-demo-seed.py --check
      - name: Java tests including real PostgreSQL migrations and transactions
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/alfa_tests
          TEST_DATABASE_USER: postgres
          TEST_DATABASE_PASSWORD: postgres
        run: ./gradlew --no-daemon clean test bootJar

  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Public isolated CI fixture; application has no default signing key.
      JWT_SECRET: CI_ONLY_DEMO_SIGNING_KEY_NOT_A_PRODUCTION_SECRET_2026
      DEMO_PROCESSING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start real stack with pending jobs
        run: DEMO_PROCESSING_ENABLED=false docker compose up --build --detach --wait --wait-timeout 180
      - name: Persist a job before process restart
        run: python3 scripts/fullstack-smoke.py --mode create-pending
      - name: Restart backend with worker enabled
        run: |
          docker compose up --detach --wait --no-deps backend
          docker compose restart frontend
          docker compose up --detach --wait --wait-timeout 120
      - name: Recovery and real API workflow through Nginx
        run: |
          python3 scripts/fullstack-smoke.py --mode verify-recovered
          python3 scripts/fullstack-smoke.py
      - name: Browser uses the real stack without transport interception
        working-directory: frontend
        env:
          REAL_STACK_BASE_URL: http://localhost:3000
        run: npm run test:fullstack
      - name: Status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 120
      - name: Stop isolated CI containers
        if: always()
        run: docker compose down
